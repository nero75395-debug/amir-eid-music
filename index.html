<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="manifest.json">
<title>أغاني</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#121212;color:#fff;font-family:system-ui,Tahoma,sans-serif;padding-bottom:380px}
small{color:#b3b3b3}
.top{position:sticky;top:0;z-index:5;background:#121212;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;gap:8px}
.top input{flex:1;min-width:0;padding:13px 18px;border-radius:26px;border:0;background:#2a2a2a;color:#fff;font-size:16px;outline:none}
.top button{flex:none;width:48px;border:0;border-radius:50%;background:#2a2a2a;color:#fff;font-size:18px}
h2{font-size:19px;margin:18px 16px 10px}
.msg{padding:40px 24px;text-align:center;color:#b3b3b3;line-height:1.8}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px}
.chip{padding:9px 16px;border-radius:20px;background:#2a2a2a;color:#fff;border:0;font-size:15px}
.artists{display:flex;gap:16px;overflow-x:auto;padding:0 16px 4px}
.ar{flex:none;width:96px;text-align:center;font-size:13px;cursor:pointer}
.ar img{width:96px;height:96px;border-radius:50%;object-fit:cover;background:#333;display:block;margin-bottom:6px}
.row{display:flex;align-items:center;gap:12px;padding:8px 16px;cursor:pointer}
.row:active{background:#222}
.row img{width:52px;height:52px;border-radius:6px;object-fit:cover;background:#333;flex:none}
.row .t{flex:1;min-width:0}
.row .t b,.row .t small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.on b{color:#1db954}
.hero{padding:20px 16px;display:flex;align-items:center;gap:16px;background:linear-gradient(#1db95488,#121212)}
.hero img{width:96px;height:96px;border-radius:50%;object-fit:cover}
.hero h1{margin:0;font-size:24px}
.back{background:none;border:0;color:#fff;font-size:16px;padding:8px 16px}
.alb{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;border-top:1px solid #222}
.alb img{width:60px;height:60px;border-radius:6px;object-fit:cover}
.alb b{display:block}
.tracks{background:#181818}
.player{position:fixed;left:0;right:0;bottom:0;background:#181818;border-top:1px solid #333;padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:9}
#vid iframe{width:100%;height:200px;border:0;border-radius:10px;margin-bottom:8px;background:#000}
.info{display:flex;align-items:center;gap:10px}
.info img{width:44px;height:44px;border-radius:6px;object-fit:cover}
.info div{flex:1;min-width:0}
.info b,.info small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;gap:10px}
.ctl button{width:44px;height:44px;border-radius:50%;border:0;background:#1db954;color:#000;font-size:18px}
audio{width:100%;margin-top:8px;height:36px}
#note{font-size:12px;color:#f5c542;margin-top:6px}
.set{margin:0 16px 8px;padding:16px;background:#1e1e1e;border-radius:12px;line-height:1.8;font-size:14px}
.set input{width:100%;padding:11px;border-radius:8px;border:0;background:#2a2a2a;color:#fff;font-size:15px;margin:8px 0;direction:ltr}
.set .chip{background:#1db954;color:#000;font-weight:700}
</style>
</head>
<body>
<div class="top">
<input id="q" type="search" placeholder="ابحث عن مطرب أو أغنية..." enterkeypress>
<button id="gear" aria-label="الإعدادات">⚙️</button>
</div>
<div id="set" class="set" hidden>
<b>التشغيل الكامل (مجاني)</b><br>
بدون مفتاح الأغاني بتشتغل 30 ثانية بس. للتشغيل الكامل من يوتيوب: ادخل console.cloud.google.com، أنشئ مشروع، فعّل YouTube Data API v3، ثم Credentials ← Create API key، والصق المفتاح هنا.
<input id="key" placeholder="YouTube API key">
<button class="chip" id="save">حفظ</button>
<small id="sst"></small><br>
<small>المفتاح المجاني له حد يومي (حوالي 100 أغنية في اليوم).</small>
</div>
<div id="main"></div>

<div class="player" id="pl" hidden>
<div id="vid"></div>
<div class="info">
<img id="pc" alt="">
<div><b id="pt"></b><small id="pa"></small></div>
<div class="ctl" style="flex:none"><button id="pv">⏮</button><button id="nx">⏭</button></div>
</div>
<audio id="au" controls hidden></audio>
<div id="note"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const API='https://api.deezer.com';
let L={},queue=[],cur=-1,curL='',KEY='';
try{KEY=localStorage.getItem('ytkey')||''}catch(e){}
$('key').value=KEY;

function jsonp0(url){
 return new Promise((res,rej)=>{
  const cb='cb'+Math.random().toString(36).slice(2);
  const s=document.createElement('script');
  const t=setTimeout(()=>{rej(new Error('timeout'));s.remove()},15000);
  window[cb]=d=>{clearTimeout(t);res(d);s.remove();delete window[cb]};
  s.onerror=()=>{clearTimeout(t);rej(new Error('fail'));s.remove()};
  s.src=url+(url.includes('?')?'&':'?')+'output=jsonp&callback='+cb;
  document.body.appendChild(s);
 });
}
async function jsonp(url){
 let last=null;
 for(let n=0;n<4;n++){
  const d=await jsonp0(url);
  if(!d||!d.error)return d;
  last=d.error;
  await new Promise(r=>setTimeout(r,1200*(n+1)));
 }
 throw new Error((last&&(last.message||last.type))||'خطأ من ديزر');
}
async function pages(url){
 let out=[];
 while(url){const d=await jsonp(url);out=out.concat(d.data||[]);url=d.next||null}
 return out;
}
function mk(t,cover){
 return{title:t.title,artist:(t.artist&&t.artist.name)||'',cover:cover||(t.album&&t.album.cover_small)||'',preview:t.preview||''};
}
function rows(id,list){
 L[id]=list;
 return list.map((t,i)=>'<div class="row" data-l="'+id+'" data-i="'+i+'"><img src="'+esc(t.cover)+'" alt=""><div class="t"><b>'+esc(t.title)+'</b><small>'+esc(t.artist)+'</small></div></div>').join('');
}

function home(){
 const names=['كاظم الساهر','جورج وسوف','أمير عيد','عمرو دياب','أم كلثوم','فيروز','تامر حسني','نانسي عجرم'];
 $('main').innerHTML='<div class="msg">اكتب اسم أي مطرب أو أغنية في البحث فوق<br>أو جرّب واحد من دول:</div><div class="chips">'+names.map(n=>'<button class="chip" data-s="'+esc(n)+'">'+esc(n)+'</button>').join('')+'</div>';
}

async function search(q){
 q=q.trim();if(!q)return;
 $('main').innerHTML='<div class="msg">جاري البحث...</div>';
 try{
  const a=await jsonp(API+'/search/artist?limit=25&q='+encodeURIComponent(q));
  const t=await jsonp(API+'/search/track?limit=50&q='+encodeURIComponent(q));
  const ar=(a.data||[]).sort((x,y)=>(y.nb_fan||0)-(x.nb_fan||0)).slice(0,12),tr=(t.data||[]).map(x=>mk(x));
  let h='';
  if(ar.length)h+='<h2>المطربين</h2><div class="artists">'+ar.map(x=>'<div class="ar" data-a="'+x.id+'" data-n="'+esc(x.name)+'" data-p="'+esc(x.picture_medium)+'"><img src="'+esc(x.picture_medium)+'" alt="">'+esc(x.name)+'</div>').join('')+'</div>';
  if(tr.length)h+='<h2>الأغاني</h2>'+rows('s',tr);
  $('main').innerHTML=h||'<div class="msg">لا توجد نتائج.</div>';
 }catch(e){
  $('main').innerHTML='<div class="msg">تعذر البحث الآن، جرب بعد شوية.<br><small dir="ltr">'+esc(e.message)+'</small></div>';
 }
}

async function openArtist(id,name,pic){
 $('main').innerHTML='<button class="back" id="bk">→ رجوع</button><div class="hero"><img src="'+esc(pic)+'" alt=""><h1>'+esc(name)+'</h1></div><div class="msg">جاري تحميل الألبومات...</div>';
 $('bk').onclick=()=>search($('q').value);
 try{
  const top=await jsonp(API+'/artist/'+id+'/top?limit=50');
  const al=await pages(API+'/artist/'+id+'/albums?limit=100');
  let tp=(top.data||[]).map(x=>mk(x));
  let dbg='top:'+tp.length+' albums:'+al.length;
  if(!tp.length&&!al.length){
   try{
    const f=await jsonp(API+'/search/track?limit=100&q='+encodeURIComponent('artist:"'+name+'"'));
    tp=(f.data||[]).map(x=>mk(x));
    dbg+=' fallback:'+tp.length;
   }catch(e){dbg+=' fallback-err:'+e.message}
  }
  al.sort((x,y)=>(y.release_date||'').localeCompare(x.release_date||''));
  const html=al.map(x=>'<div class="alb" data-al="'+x.id+'" data-c="'+esc(x.cover_medium)+'"><img src="'+esc(x.cover_medium)+'" alt=""><div><b>'+esc(x.title)+'</b><small>'+esc((x.release_date||'').slice(0,4))+'</small></div></div><div class="tracks" id="al'+x.id+'" hidden></div>').join('');
  $('main').querySelector('.msg').outerHTML=(tp.length?'<h2>أشهر الأغاني</h2>'+rows('top',tp):'')+(al.length?'<h2>كل الألبومات ('+al.length+')</h2>'+html:'')+(!tp.length&&!al.length?'<div class="msg">مفيش أغاني لهذا المطرب في ديزر. جرّب تبحث باسم الأغنية.<br><small dir="ltr">'+dbg+'</small></div>':'');
 }catch(e){
  $('main').querySelector('.msg').textContent='تعذر التحميل، جرب تاني.';
 }
}
async function toggleAlbum(id,cover){
 const box=$('al'+id);
 if(!box.hidden){box.hidden=true;return}
 box.hidden=false;
 if(box.dataset.done)return;
 box.innerHTML='<div class="msg" style="padding:14px">...</div>';
 try{
  const d=await pages(API+'/album/'+id+'/tracks?limit=100');
  box.innerHTML=rows('a'+id,d.map(x=>mk(x,cover)));
  box.dataset.done=1;
 }catch(e){box.innerHTML='<div class="msg" style="padding:14px">تعذر التحميل.</div>'}
}

async function ytId(t){
 const k='yt:'+t.artist+'|'+t.title;
 try{const c=localStorage.getItem(k);if(c)return c}catch(e){}
 const r=await fetch('https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=1&q='+encodeURIComponent(t.artist+' '+t.title)+'&key='+encodeURIComponent(KEY));
 const d=await r.json();
 if(d.error)throw new Error(d.error.message);
 const id=d.items&&d.items[0]&&d.items[0].id.videoId;
 if(id)try{localStorage.setItem(k,id)}catch(e){}
 return id;
}

async function play(i){
 if(i<0||i>=queue.length)return;
 cur=i;const t=queue[i];
 $('pl').hidden=false;
 $('pt').textContent=t.title;$('pa').textContent=t.artist;$('pc').src=t.cover;
 document.querySelectorAll('.row').forEach(r=>r.classList.toggle('on',r.dataset.l===curL&&+r.dataset.i===i));
 const au=$('au');au.pause();au.hidden=true;$('vid').innerHTML='';$('note').textContent='';
 if(KEY){
  try{
   const id=await ytId(t);
   if(cur!==i)return;
   if(id){$('vid').innerHTML='<iframe src="https://www.youtube.com/embed/'+id+'?autoplay=1&playsinline=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>';return}
  }catch(e){$('note').textContent='تعذر التشغيل الكامل (المفتاح أو الحد اليومي)، بيشتغل مقطع 30 ثانية.'}
 }
 if(t.preview){
  au.src=t.preview;au.hidden=false;au.play().catch(()=>{});
  if(!KEY)$('note').textContent='مقطع 30 ثانية. للتشغيل الكامل أضف مفتاح يوتيوب من ⚙️';
 }else $('note').textContent='لا يوجد تشغيل متاح لهذه الأغنية.';
}

$('main').onclick=e=>{
 const r=e.target.closest('.row'),a=e.target.closest('.ar'),al=e.target.closest('.alb'),c=e.target.closest('.chip');
 if(c){$('q').value=c.dataset.s;search(c.dataset.s)}
 else if(r){curL=r.dataset.l;queue=L[curL];play(+r.dataset.i)}
 else if(a)openArtist(a.dataset.a,a.dataset.n,a.dataset.p);
 else if(al)toggleAlbum(al.dataset.al,al.dataset.c);
};
$('q').onkeydown=e=>{if(e.key==='Enter')search($('q').value)};
$('gear').onclick=()=>{$('set').hidden=!$('set').hidden};
$('save').onclick=()=>{
 KEY=$('key').value.trim();
 try{localStorage.setItem('ytkey',KEY)}catch(e){}
 $('sst').textContent='تم الحفظ ✓';
};
$('nx').onclick=()=>play(cur+1);
$('pv').onclick=()=>play(cur-1);
$('au').onended=()=>play(cur+1);
home();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
