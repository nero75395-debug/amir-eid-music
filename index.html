<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="manifest.json">
<title>أمير عيد</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#121212;color:#fff;font-family:system-ui,Tahoma,sans-serif;padding-bottom:300px}
.hero{padding:40px 16px 20px;background:linear-gradient(#1db954aa,#121212);text-align:center}
.hero img{width:140px;height:140px;border-radius:50%;object-fit:cover;box-shadow:0 8px 24px #0008}
.hero h1{margin:12px 0 4px;font-size:28px}
.hero p{margin:0;color:#b3b3b3}
.alb{padding:16px 16px 4px;display:flex;align-items:center;gap:12px}
.alb img{width:64px;height:64px;border-radius:6px}
.alb b{display:block}
.alb small{color:#b3b3b3}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid #222}
.row:active,.row.on{background:#282828}
.row .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .n{color:#b3b3b3;width:22px;text-align:center}
.row.on .t{color:#1db954}
.msg{padding:30px;text-align:center;color:#b3b3b3}
.player{position:fixed;bottom:0;left:0;right:0;background:#181818;border-top:1px solid #333;padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.player .name{font-size:14px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#yt{width:100%;height:170px;border:0;border-radius:8px;background:#000}
.ctl{display:flex;justify-content:center;gap:24px;margin-top:6px}
.ctl button{background:#1db954;color:#000;border:0;border-radius:50%;width:44px;height:44px;font-size:18px}
</style>
</head>
<body>
<div class="hero">
<img id="pic" alt="">
<h1 id="artist">أمير عيد</h1>
<p id="fans"></p>
</div>
<div id="list"><div class="msg">جاري تحميل كل الألبومات...</div></div>
<div class="player">
<div class="name" id="now">اختر أغنية</div>
<iframe id="yt" allow="autoplay; encrypted-media" allowfullscreen></iframe>
<div class="ctl"><button id="nx">⏭</button><button id="pv">⏮</button></div>
</div>
<script>
const ARTIST_ID=4839853;
const $=id=>document.getElementById(id);
let tracks=[],cur=-1;

function jsonp(url){
 return new Promise((res,rej)=>{
  const cb='cb'+Math.random().toString(36).slice(2);
  const s=document.createElement('script');
  const t=setTimeout(()=>{rej(new Error('timeout'));s.remove()},15000);
  window[cb]=d=>{clearTimeout(t);res(d);s.remove();delete window[cb]};
  s.onerror=()=>{clearTimeout(t);rej(new Error('fail'));s.remove()};
  s.src=url+(url.includes('?')?'&':'?')+'output=jsonp&callback='+cb;
  document.body.appendChild(s);
 });
}

async function pages(url){
 let out=[];
 while(url){
  const d=await jsonp(url);
  out=out.concat(d.data||[]);
  url=d.next||null;
 }
 return out;
}

async function load(){
 try{
  const a=await jsonp('https://api.deezer.com/artist/'+ARTIST_ID);
  $('pic').src=a.picture_big||a.picture_medium;
  $('artist').textContent=a.name;
  $('fans').textContent=(a.nb_fan||0).toLocaleString('ar')+' معجب';

  const albums=await pages('https://api.deezer.com/artist/'+ARTIST_ID+'/albums?limit=100');
  albums.sort((x,y)=>(x.release_date||'').localeCompare(y.release_date||''));

  $('list').innerHTML='';
  for(const al of albums){
   let list=[];
   try{
    const d=await jsonp('https://api.deezer.com/album/'+al.id+'/tracks?limit=100');
    list=d.data||[];
   }catch(e){}
   const start=tracks.length;
   list.forEach(t=>tracks.push({title:t.title,artist:(t.artist&&t.artist.name)||a.name,album:al.title}));
   const year=(al.release_date||'').slice(0,4);
   let html='<div class="alb"><img src="'+al.cover_medium+'" alt=""><div><b>'+al.title+'</b><small>'+year+' • '+list.length+' أغنية</small></div></div>';
   list.forEach((t,i)=>{
    html+='<div class="row" data-i="'+(start+i)+'"><div class="n">'+(i+1)+'</div><div class="t">'+t.title+'</div></div>';
   });
   $('list').insertAdjacentHTML('beforeend',html);
  }
  document.querySelectorAll('.row').forEach(r=>r.onclick=()=>play(+r.dataset.i));
  if(!tracks.length)$('list').innerHTML='<div class="msg">لا توجد أغاني.</div>';
 }catch(e){
  $('list').innerHTML='<div class="msg">تعذر التحميل، تأكد من النت وجرب تاني.</div>';
 }
}

function play(i){
 if(i<0||i>=tracks.length)return;
 cur=i;
 const t=tracks[i];
 $('now').textContent=t.title+' - '+t.album;
 const q=encodeURIComponent(t.artist+' '+t.title);
 $('yt').src='https://www.youtube.com/embed?listType=search&list='+q+'&autoplay=1';
 document.querySelectorAll('.row').forEach(r=>r.classList.toggle('on',+r.dataset.i===i));
}
$('nx').onclick=()=>play(cur+1);
$('pv').onclick=()=>play(cur-1);
load();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
